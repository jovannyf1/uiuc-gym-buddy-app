# The Vercel website proxies /api to this persistent Express service.
# Email and site URLs are added in Render after Vercel assigns its public URL.
services:
  - type: web
    name: uiuc-gym-buddy-api
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /api/auth/netid/config
    disk:
      name: app-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: COOKIE_SECURE
        value: 'true'
      - key: ALLOW_PILOT_AUTH
        value: 'false'
